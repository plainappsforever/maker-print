appId: ${APP_ID}
name: Selftest - engine W1-W10, referee PDFs written on the device's JS engine, imports, rasteriser
tags:
  - selftest
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: makerprint-dev://debug?run=selftest
- extendedWaitUntil:
    visible:
      id: selftest-result
      text: "SELFTEST (OK|FAIL).*"
    timeout: 180000
- assertVisible:
    id: selftest-result
    text: "SELFTEST OK.*"
