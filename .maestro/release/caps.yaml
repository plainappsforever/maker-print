appId: ${APP_ID}
name: Release caps - engine limits and timings on the Release Hermes build (writes caps.json; D82; not part of the release run, ~10 min)
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: projects-screen
    timeout: 90000
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ${SCHEME}://debug?run=caps
- extendedWaitUntil:
    visible:
      id: caps-result
      text: "CAPS DONE.*"
    timeout: 1200000
