# Store screenshots (v1.1): fresh install of the PRODUCTION Release build, millimetres + A4, then four template projects
# (generated by the app, no photos): circles, test square, graph paper, 1 m ruler (newest = project-0).
# Run: maestro --device <udid> test -e APP_ID=com.plainapps.makerprint -e APPLE_LANG="(en)" .maestro/store-shots/seed.yaml  (DE: "(de)")
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
    clearState: true
    arguments:
      AppleLanguages: "${APPLE_LANG}"
- extendedWaitUntil:
    visible:
      id: projects-screen
    timeout: 90000
- tapOn:
    id: open-settings
- scrollUntilVisible:
    element:
      id: set-units-mm
    centerElement: true
- tapOn:
    id: set-units-mm
- scrollUntilVisible:
    element:
      id: set-paper-a4
    centerElement: true
- tapOn:
    id: set-paper-a4
- runFlow: ../subflows/launch.yaml
- tapOn:
    id: new-project
- tapOn:
    id: new-template
- tapOn:
    id: template-circles
- tapOn:
    id: template-paper-a4
- tapOn:
    id: template-create
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 15000
- runFlow: ../subflows/launch.yaml
- tapOn:
    id: new-project
- tapOn:
    id: new-template
- tapOn:
    id: template-test_square
- tapOn:
    id: template-paper-a4
- tapOn:
    id: template-create
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 15000
- runFlow: ../subflows/launch.yaml
- tapOn:
    id: new-project
- tapOn:
    id: new-template
- tapOn:
    id: template-grid
- tapOn:
    id: template-paper-a4
- tapOn:
    id: template-create
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 15000
- runFlow: ../subflows/launch.yaml
- tapOn:
    id: new-project
- tapOn:
    id: new-template
- tapOn:
    id: template-ruler
- tapOn:
    id: template-length
- eraseText: 20
- inputText: "1000"
- tapOn:
    id: template-paper-a4
- tapOn:
    id: template-create
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 15000
- runFlow: ../subflows/launch.yaml
