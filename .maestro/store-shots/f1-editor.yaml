appId: ${APP_ID}
---
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "${APPLE_LANG}"
- extendedWaitUntil:
    visible:
      id: projects-screen
    timeout: 90000
- tapOn:
    id: project-1
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 15000
- waitForAnimationToEnd
