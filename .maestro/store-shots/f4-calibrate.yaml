appId: ${APP_ID}
---
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "${APPLE_LANG}"
- extendedWaitUntil:
    visible:
      id: projects-screen
    timeout: 90000
- tapOn:
    id: open-calibrate
- tapOn:
    id: cal-new-profile
- inputText: "${PRINTER_NAME}"
- pressKey: Enter
- tapOn:
    id: paper-a4
- assertVisible:
    id: print-calibration
- waitForAnimationToEnd
