appId: ${APP_ID}
---
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "${APPLE_LANG}"
- extendedWaitUntil:
    visible:
      id: projects-screen
    timeout: 90000
- tapOn:
    id: project-0
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: editor-print
- extendedWaitUntil:
    visible:
      id: page-1-raster
    timeout: 60000
- waitForAnimationToEnd
