<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="50mm" height="50mm" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="g"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
    <marker id="arrow" markerWidth="4" markerHeight="4"><path d="M0 0 L4 2 L0 4z"/></marker>
    <mask id="m"><rect width="50" height="50" fill="white"/></mask>
    <pattern id="p" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2"/></pattern>
  </defs>
  <style>rect.a { fill: #00ff00 } g > .b { stroke: black } svg [data-x] { fill: red } @media print { rect { fill: blue } }</style>
  <rect class="a" x="1" y="1" width="10" height="10"/>
  <rect x="12" y="1" width="10" height="10" fill="url(#g)"/>
  <rect x="23" y="1" width="10" height="10" fill="url(#p)"/>
  <rect x="34" y="1" width="10" height="10" fill="#f00" filter="url(#blur)"/>
  <path d="M1 20 H40" stroke="#000" marker-end="url(#arrow)"/>
  <rect x="1" y="25" width="10" height="10" mask="url(#m)"/>
  <text x="1" y="45">Hello</text>
  <image x="20" y="25" width="10" height="10" href="photo.png"/>
  <use href="#missing"/>
  <use href="other.svg#x"/>
  <animate attributeName="x" to="5"/>
  <foo:bar xmlns:foo="http://example.com/foo"/>
  <frobnicate/>
  <circle cx="45" cy="45" r="3" fill="papayawhip" stroke-dasharray="1 2" stroke="#000"/>
</svg>
